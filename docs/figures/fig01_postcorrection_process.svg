<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="298" fill="white" stroke="none"/>
  <text x="480" y="28" font-size="22" font-weight="700" text-anchor="middle">
    Процесс проверки OCR-посткоррекции
  </text>
  
  <rect x="35" y="55" width="170" height="70" rx="12" ry="12"
        fill="white" stroke="black" stroke-width="1.5"/>
  <text x="120.0" y="85" font-size="18" font-weight="700"
        text-anchor="middle">Исходный текст</text>
  <text x="120.0" y="109" font-size="13"
        text-anchor="middle">чистый корпус</text>
  <rect x="260" y="55" width="190" height="70" rx="12" ry="12"
        fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355.0" y="85" font-size="18" font-weight="700"
        text-anchor="middle">Синтетический шум</text>
  <text x="355.0" y="109" font-size="13"
        text-anchor="middle">OCR-подобные искажения</text>
  <rect x="505" y="55" width="190" height="70" rx="12" ry="12"
        fill="white" stroke="black" stroke-width="1.5"/>
  <text x="600.0" y="85" font-size="18" font-weight="700"
        text-anchor="middle">Модель коррекции</text>
  <text x="600.0" y="109" font-size="13"
        text-anchor="middle">ByT5-small / baseline</text>
  <rect x="750" y="55" width="170" height="70" rx="12" ry="12"
        fill="white" stroke="black" stroke-width="1.5"/>
  <text x="835.0" y="85" font-size="18" font-weight="700"
        text-anchor="middle">Эталонный текст</text>
  <text x="835.0" y="109" font-size="13"
        text-anchor="middle">оценка CER/WER</text>
  <rect x="260" y="185" width="190" height="70" rx="12" ry="12"
        fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355.0" y="215" font-size="18" font-weight="700"
        text-anchor="middle">Real-OCR sanity</text>
  <text x="355.0" y="239" font-size="13"
        text-anchor="middle">Tesseract, страницы</text>
  <rect x="505" y="185" width="190" height="70" rx="12" ry="12"
