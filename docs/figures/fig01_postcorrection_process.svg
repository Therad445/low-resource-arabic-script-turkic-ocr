  <text x="600.0" y="215" font-size="18" font-weight="700"
        text-anchor="middle">Проверка переноса</text>
  <text x="600.0" y="239" font-size="13"
        text-anchor="middle">synthetic → real</text>
  
  <line x1="205" y1="90" x2="260" y2="90"
        stroke="black" stroke-width="1.8" marker-end="url(#arrow)"/>
  
  <line x1="450" y1="90" x2="505" y2="90"
        stroke="black" stroke-width="1.8" marker-end="url(#arrow)"/>
  
  <line x1="695" y1="90" x2="750" y2="90"
        stroke="black" stroke-width="1.8" marker-end="url(#arrow)"/>
  
  <line x1="355" y1="125" x2="355" y2="185"
